<!doctype html>
<!--
  Source for public/og.png — the 1200x630 card shown when the site is pasted
  into X, WhatsApp, Discord, Slack or iMessage.

  Kept as HTML rather than a hand-drawn PNG so the wording can be edited later
  without a design tool. Regenerate with:

    npm run og

  It is a build input, not a shipped page: nothing links to it, and it never
  leaves scripts/.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* No webfont: the render has no network, and a missing font would
         silently fall back mid-screenshot. Roboto if the machine has it,
         system sans otherwise — both are the right shape here. */
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 28px;
        padding: 0 88px;
        background: #0f0f0f;
        color: #f1f1f1;
        font-family: Roboto, 'Segoe UI', system-ui, sans-serif;
        /* A red wash bleeding from the top-left, so the card doesn't read as a
           flat black rectangle in a feed full of flat black rectangles. */
        background-image: radial-gradient(900px 600px at 0% 0%, rgba(255, 0, 0, 0.18), transparent 70%);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 30px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      .brand sup {
        font-size: 14px;
        font-weight: 700;
        color: #aaaaaa;
        letter-spacing: 0.08em;
      }

      h1 {
        font-size: 76px;
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.03em;
      }

      h1 em { font-style: normal; color: #ff4e45; }

      p {
        max-width: 900px;
        font-size: 30px;
        line-height: 1.4;
        color: #aaaaaa;
      }

      .chips { display: flex; gap: 12px; margin-top: 8px; }

      .chip {
        padding: 10px 20px;
        font-size: 22px;
        color: #f1f1f1;
        background: #212121;
        border: 1px solid #303030;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg viewBox="0 0 28 20" width="52" height="37" aria-hidden="true">
        <path
          fill="#f00"
          d="M27.4 3.1A3.5 3.5 0 0 0 24.9.6C22.7 0 14 0 14 0S5.3 0 3.1.6A3.5 3.5 0 0 0 .6 3.1C0 5.3 0 10 0 10s0 4.7.6 6.9a3.5 3.5 0 0 0 2.5 2.5C5.3 20 14 20 14 20s8.7 0 10.9-.6a3.5 3.5 0 0 0 2.5-2.5C28 14.7 28 10 28 10s0-4.7-.6-6.9Z"
        />
        <path fill="#fff" d="M11.2 14.3 18.4 10l-7.2-4.3v8.6Z" />
      </svg>
      Audit<sup>BETA</sup>
    </div>

    <h1>Score any YouTube<br />channel in <em>seconds</em></h1>

    <p>Fourteen public-data checks on titles, descriptions, tags and upload habits — measured against the channel's own median.</p>

    <div class="chips">
      <span class="chip">Free</span>
      <span class="chip">No extension</span>
      <span class="chip">Any channel</span>
    </div>
  </body>
</html>
