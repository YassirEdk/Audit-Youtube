<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Under ~60 characters so it isn't truncated in results, with the phrase
         people actually search for at the front. -->
    <title>Free YouTube Channel Audit — Score Any Channel Instantly</title>

    <!-- Not a ranking factor on its own, but it is the copy shown under the
         link, so it decides whether the ranking turns into a visit. -->
    <meta
      name="description"
      content="Score any YouTube channel against its own median performance. Twelve public-data checks on titles, descriptions, tags and upload habits. No login, no extension."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Free YouTube Channel Audit" />
    <meta
      property="og:description"
      content="Score any YouTube channel against its own median performance. No login, no extension."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
